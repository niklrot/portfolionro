<head>

  <style>
    /* RESET & BASICS */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000000;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    /* CONTAINER */
    .app-container {
      width: 100%;
      max-width: 470px; /* Standard für Handy */
      background-color: #000000;
      min-height: 100vh;
      border-left: 1px solid #262626;
      border-right: 1px solid #262626;
      padding-bottom: 60px;
      position: relative;
      margin: 0 auto;
    }

    /* HEADER / PROFILBEREICH */
    .profile-header {
      padding: 20px 16px 10px 16px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .username {
      font-weight: 600;
      font-size: 20px;
      color: #f5f5f5;
    }

    .profile-info {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .profile-pic-container {
      margin-right: 28px;
      flex-shrink: 0;
    }

    .profile-pic {
      width: 77px;
      height: 77px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #262626;
      display: block;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      flex-grow: 1;
      text-align: center;
    }

    .stat-item .num {
      font-weight: 600;
      font-size: 16px;
      display: block;
    }

    .stat-item .label {
      font-size: 13px;
      color: #a8a8a8;
    }

    /* BIO */
    .bio {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .bio-name {
      font-weight: 600;
    }

    /* BUTTONS */
    .action-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .btn {
      flex: 1;
      padding: 7px 0;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-primary {
      background-color: #0095f6;
      color: #ffffff;
    }

    .btn-secondary {
      background-color: #363636;
      color: #f5f5f5;
    }

    /* HIGHLIGHTS */
    .highlights-container {
      display: flex;
      gap: 18px;
      padding: 10px 16px 15px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #262626;
    }

    .highlights-container::-webkit-scrollbar {
      display: none;
    }

    .highlight-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .highlight-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      padding: 2px;
      border: 1px solid #555555;
      margin-bottom: 4px;
    }

    .highlight-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .highlight-title {
      font-size: 12px;
      color: #a8a8a8;
    }

    /* TAB LEISTE */
    .tabs {
      display: flex;
      border-bottom: 1px solid #262626;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      cursor: pointer;
    }

    .tab.active {
      border-bottom: 2px solid #f5f5f5;
    }

    .tab svg {
      width: 24px;
      height: 24px;
      fill: #8e8e8e;
    }

    .tab.active svg {
      fill: #f5f5f5;
    }

    /* GRID (Standard: Handy 3 Spalten) */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      background-color: #000000;
    }

    .grid-item {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #262626;
      overflow: hidden;
      cursor: pointer;
    }

    .grid-item img,
    .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .reel-badge, .carousel-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 18px;
      height: 18px;
      fill: #ffffff;
      filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));
      pointer-events: none;
    }

    /* BOTTOM APP NAVIGATION */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 470px; /* Standard für Handy */
      height: 48px;
      background-color: #000000;
      border-top: 1px solid #262626;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .bottom-nav svg {
      width: 24px;
      height: 24px;
      fill: #f5f5f5;
    }

    /* PC BZW. DESKTOP ANPASSUNGEN (Ab 768px Breite) */
    @media (min-width: 768px) {
      .app-container {
        max-width: 1000px; /* Breite Ansicht auf dem PC */
      }
      
      .bottom-nav {
        max-width: 1000px; /* Passt sich der neuen Breite an */
      }

      /* 4er Grid für PC */
      .grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px; /* Auf dem großen Bildschirm sieht etwas mehr Abstand besser aus */
      }

      /* Zentriert den Profilkopf, damit er nicht unangenehm breit gestreckt wird */
      .profile-header-content {
        max-width: 600px;
        margin: 0 auto; 
      }

      /* Highlights werden auf PC schöner zentriert */
      .highlights-container {
        justify-content: center;
        gap: 30px;
      }
    }

    /* MODAL CONTAINER (Pop-Up) */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      z-index: 1001;
    }

    /* DESKTOP MODAL LAYOUT */
    .modal-content {
      display: flex;
      flex-direction: row;
      max-width: 900px;
      width: 100%;
      max-height: 80vh;
      background-color: #000000;
      border: 1px solid #262626;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    #modalMedia {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #000000;
      overflow: hidden;
    }

    #modalMedia img,
    #modalMedia video {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
    }

    /* SIDEBAR (Caption) */
    .modal-sidebar {
      width: 320px;
      background-color: #121212; 
      border-left: 1px solid #262626;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .modal-sidebar-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #262626;
    }

    .modal-sidebar-header img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 12px;
      object-fit: cover;
    }

    .modal-sidebar-body {
      padding: 16px;
      display: flex;
      align-items: flex-start;
      overflow-y: auto;
    }

    .modal-sidebar-body img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .caption-text {
      font-size: 14px;
      line-height: 1.5;
      color: #f5f5f5;
    }

    .caption-text .username {
      font-size: 14px;
      margin-right: 5px;
    }

    /* KARUSSELL STYLES FÜR MODAL */
    .carousel-nav {
      position: absolute;
      width: 100%;
      display: flex;
      justify-content: space-between;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      padding: 0 10px;
    }

    .nav-btn {
      pointer-events: auto;
      background: rgba(255,255,255,0.7);
      color: #000;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 20px;
      border-radius: 50%;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,1);
    }

    .carousel-indicators {
      position: absolute;
      bottom: 15px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .dot {
      height: 6px;
      width: 6px;
      background-color: rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      display: inline-block;
    }

    .dot.active {
      background-color: #ffffff;
    }

    /* RESPONSIVE MODAL: Auf dem Handy untereinander stapeln */
    @media (max-width: 768px) {
      .modal-content {
        flex-direction: column;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-sidebar {
        width: 100%;
        border-left: none;
        border-top: 1px solid #262626;
        min-height: 150px;
      }
      #modalMedia img,
      #modalMedia video {
        max-height: 50vh;
      }
      .close-btn {
        top: 5px;
        right: 15px;
      }
    }
  </style>
</head>

      let currentPostId = null;
      let currentSlide = 0;

      function openPost(id) {
        currentPostId = id;
        currentSlide = 0;
        renderModal();
        document.getElementById('mediaModal').style.display = 'flex';
      }

      function renderModal() {
        const modalMedia = document.getElementById('modalMedia');
        const captionBody = document.getElementById('modalCaption');
        const post = postsData[currentPostId];
        let content = '';

        if (post.type === 'image') {
          content = `<img src="${post.src}" alt="Vergrößerte Ansicht">`;
        } 
        else if (post.type === 'video') {
          content = `
            <video controls autoplay loop playsinline style="max-height: 80vh; width: 100%;">
              <source src="${post.src}" type="video/mp4">
            </video>`;
        } 
        else if (post.type === 'carousel') {
          const hasPrev = currentSlide > 0;
          const hasNext = currentSlide < post.src.length - 1;
          
          content = `
            <img src="${post.src[currentSlide]}" alt="Slide ${currentSlide + 1}">
            <div class="carousel-nav">
              ${hasPrev ? `<button class="nav-btn" onclick="changeSlide(-1, event)">&#10094;</button>` : '<div></div>'}
              ${hasNext ? `<button class="nav-btn" onclick="changeSlide(1, event)">&#10095;</button>` : '<div></div>'}
            </div>
            <div class="carousel-indicators">
              ${post.src.map((_, index) => `<span class="dot ${index === currentSlide ? 'active' : ''}"></span>`).join('')}
            </div>
          `;
        }

        modalMedia.innerHTML = content;
        captionBody.innerHTML = (post.caption || '').replace(/\n/g, '<br>');
      }

      function changeSlide(direction, event) {
        event.stopPropagation();
        currentSlide += direction;
        renderModal();
      }

      function closeModal(event) {
        if (event.target.id === 'mediaModal') {
          forceCloseModal();
        }
      }

      function forceCloseModal() {
        const modal = document.getElementById('mediaModal');
        const modalMedia = document.getElementById('modalMedia');
        const captionBody = document.getElementById('modalCaption');
        modal.style.display = 'none';
        modalMedia.innerHTML = ''; 
        captionBody.innerHTML = '';
      }
    </script>
</body>
